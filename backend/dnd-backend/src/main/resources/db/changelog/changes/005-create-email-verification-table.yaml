databaseChangeLog:
  - changeSet:
      id: 005-create-email-verification-table
      author: dark_soul
      changes:
        - createTable:
            tableName: email_verification
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    uniqueConstraintName: "UK_email_verification_token_hash"
                    nullable: false
              - column:
                  name: expires_at
                  type: "TIMESTAMP WITH TIME ZONE"
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: "TIMESTAMP WITH TIME ZONE"
        - addForeignKeyConstraint:
            baseTableName: email_verification
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_email_verification_user_id
            onDelete: CASCADE