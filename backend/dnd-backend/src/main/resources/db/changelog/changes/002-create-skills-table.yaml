databaseChangeLog:
  - changeSet:
      id: 002-create-skills-table
      author: dark_soul
      changes:
        - createTable:
            tableName: skills
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: character_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: activation_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: usage_policy
                  type: VARCHAR(50)
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: skills
            baseColumnNames: character_id
            referencedTableName: characters
            referencedColumnNames: id
            constraintName: fk_skills_character
            onDelete: CASCADE