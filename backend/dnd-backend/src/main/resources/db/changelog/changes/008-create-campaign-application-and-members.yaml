databaseChangeLog:
  - changeSet:
      id: 008-create-campaign-application-and-members
      author: dark_soul
      changes:
        - createTable:
            tableName: campaign_applications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: campaign_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: applicant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: character_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: campaign_applications
            baseColumnNames: campaign_id
            referencedTableName: campaigns
            referencedColumnNames: id
            constraintName: fk_campaign_applications_campaign
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: campaign_applications
            baseColumnNames: applicant_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_campaign_applications_applicant
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: campaign_applications
            baseColumnNames: character_id
            referencedTableName: characters
            referencedColumnNames: id
            constraintName: fk_campaign_applications_character
            onDelete: CASCADE

        - createIndex:
            tableName: campaign_applications
            indexName: idx_campaign_applications_campaign_id
            columns:
              - column:
                  name: campaign_id

        - createIndex:
            tableName: campaign_applications
            indexName: idx_campaign_applications_applicant_id
            columns:
              - column:
                  name: applicant_id

        - createIndex:
            tableName: campaign_applications
            indexName: idx_campaign_applications_character_id
            columns:
              - column:
                  name: character_id

        - createIndex:
            tableName: campaign_applications
            indexName: idx_campaign_applications_status
            columns:
              - column:
                  name: status

        - sql:
            dbms: postgresql
            sql: >-
              CREATE UNIQUE INDEX uq_campaign_applications_pending_applicant
              ON campaign_applications (campaign_id, applicant_id)
              WHERE status = 'PENDING'

        - createTable:
            tableName: campaign_members
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: campaign_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: character_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: campaign_members
            baseColumnNames: campaign_id
            referencedTableName: campaigns
            referencedColumnNames: id
            constraintName: fk_campaign_members_campaign
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: campaign_members
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_campaign_members_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: campaign_members
            baseColumnNames: character_id
            referencedTableName: characters
            referencedColumnNames: id
            constraintName: fk_campaign_members_character
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: campaign_members
            columnNames: campaign_id, user_id
            constraintName: uq_campaign_members_campaign_user

        - addUniqueConstraint:
            tableName: campaign_members
            columnNames: campaign_id, character_id
            constraintName: uq_campaign_members_campaign_character

        - createIndex:
            tableName: campaign_members
            indexName: idx_campaign_members_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: campaign_members
            indexName: idx_campaign_members_character_id
            columns:
              - column:
                  name: character_id

      rollback:
        - dropTable:
            tableName: campaign_members
        - dropTable:
            tableName: campaign_applications
