databaseChangeLog:
  - changeSet:
      id: 000-create-users-table
      author: dark_soul
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: "UK_users_email"
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: "TIMESTAMP WITH TIME ZONE"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: "TIMESTAMP WITH TIME ZONE"
                  constraints:
                    nullable: false
              - column:
                  name: email_verified_at
                  type: "TIMESTAMP WITH TIME ZONE"