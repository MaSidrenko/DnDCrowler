databaseChangeLog:
  - changeSet:
      id: 006-add-created-at-to-email-verification
      author: dark_soul
      changes:
        - addColumn:
            tableName: email_verification
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false