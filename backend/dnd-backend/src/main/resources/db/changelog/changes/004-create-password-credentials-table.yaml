databaseChangeLog:
  - changeSet:
      id: 004-create-password-credentials-table
      author: dark_soul
      changes:
        - createTable:
            tableName: password_credentials
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_changed_at
                  type: "TIMESTAMP WITH TIME ZONE"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: password_credentials
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_credentials_user_id
            onDelete: CASCADE