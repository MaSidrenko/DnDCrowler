databaseChangeLog:
  - changeSet:
      id: 003-create-effects-table
      author: dark_soul
      changes:
        - createTable:
            tableName: skill_effects
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: skill_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: effect_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: stat
                  type: VARCHAR(50)
              - column:
                  name: amount
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: skill_effects
            baseColumnNames: skill_id
            referencedTableName: skills
            referencedColumnNames: id
            constraintName: fk_skill_effects_skill_id
            onDelete: CASCADE
            onUpdate: CASCADE